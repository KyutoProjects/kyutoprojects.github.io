<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <style>
    body {
      margin: 0;
      background-color: #0b0d12;
      font-family: system-ui, -apple-system, sans-serif;
      color: #ffffff;
    }

    /* Minimal margin grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2px; /* Creates the near-zero margin effect between images */
      padding: 2px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 4 / 3; /* Keeps all images uniformly sized */
      overflow: hidden;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      cursor: zoom-in;
    }

    /* Subtle zoom without darkening the image */
    .gallery-item:hover img {
      transform: scale(1.05);
    }

    /* Bottom-right text alignment */
    .hover-content {
      position: absolute;
      bottom: 15px;
      right: 15px;
      text-align: right;
      opacity: 0;
      transition: opacity 0.4s ease;
      /* Heavy text shadow ensures readability without dimming the background */
      text-shadow: 0px 2px 8px rgba(0, 0, 0, 0.9), 0px 0px 4px rgba(0, 0, 0, 0.6);
      pointer-events: none; /* Prevents text from interfering with mouse hovering */
    }

    .gallery-item:hover .hover-content {
      opacity: 1;
    }

    .hover-date {
      font-size: 0.85rem;
      color: #e4e4e7;
      margin-bottom: 2px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .hover-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0;
    }

    .gallery-item img:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: -3px;
    }

    .image-viewer {
      box-sizing: border-box;
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      padding: 3rem;
      border: 0;
      background: #000000;
      color: #ffffff;
    }

    .image-viewer[open] {
      display: grid;
      place-items: center;
    }

    .image-viewer::backdrop {
      background: #000000;
    }

    .image-viewer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .image-viewer button {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .image-viewer {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="gallery-grid">
    
    <!-- Gallery Item 1 -->
    <div class="gallery-item">
      <img src="illust/1.jpg" alt="Gallery Image 1" loading="lazy">
      <div class="hover-content">
        <div class="hover-date">October 12, 2026</div>
        <h3 class="hover-title">Mountain Summit</h3>
      </div>
    </div>

    <!-- Gallery Item 2 -->
    <div class="gallery-item">
      <img src="illust/2.jpg" alt="Gallery Image 2" loading="lazy">
      <div class="hover-content">
        <div class="hover-date">September 28, 2026</div>
        <h3 class="hover-title">City Lights</h3>
      </div>
    </div>

    <!-- Gallery Item 3 -->
    <div class="gallery-item">
      <img src="illust/3.jpg" alt="Gallery Image 3" loading="lazy">
      <div class="hover-content">
        <div class="hover-date">August 05, 2026</div>
        <h3 class="hover-title">Ocean View</h3>
      </div>
    </div>

    <!-- Add more items by copying the block above -->

  </div>

  <dialog class="image-viewer" aria-label="Full-screen image viewer">
    <img alt="">
    <button type="button" aria-label="Close full-screen image">×</button>
  </dialog>

  <script>
    const imageViewer = document.querySelector('.image-viewer');
    const viewerImage = imageViewer.querySelector('img');
    const gallery = document.querySelector('.gallery-grid');

    function openImageViewer(image) {
      viewerImage.src = image.currentSrc || image.src;
      viewerImage.alt = image.alt;
      imageViewer.showModal();
    }

    gallery.addEventListener('click', (event) => {
      const image = event.target.closest('.gallery-item img');
      if (image) openImageViewer(image);
    });

    gallery.addEventListener('keydown', (event) => {
      const image = event.target.closest('.gallery-item img');
      if (image && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        openImageViewer(image);
      }
    });

    imageViewer.querySelector('button').addEventListener('click', () => imageViewer.close());
    imageViewer.addEventListener('click', (event) => {
      if (event.target === imageViewer) imageViewer.close();
    });

    document.querySelectorAll('.gallery-item img').forEach((image) => {
      image.tabIndex = 0;
      image.setAttribute('role', 'button');
      image.setAttribute('aria-haspopup', 'dialog');
      image.setAttribute('aria-label', `View ${image.alt} full screen`);
    });
  </script>

</body>
</html>
